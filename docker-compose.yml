services:
  api:
    build: .
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PREDICTION_TOPIC: cian.predictions
    volumes:
      - .:/app
    depends_on:
      - kafka
      - mlflow

  streamlit:
    build: .
    command: python -m streamlit run src/app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/app
    depends_on:
      - api

  mlflow:
    build: .
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1,127.0.0.1:5001
      --cors-allowed-origins http://localhost:5001,http://127.0.0.1:5001
      --backend-store-uri sqlite:////app/data/mlflow/mlflow.db
      --default-artifact-root /app/data/mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - .:/app

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  airflow:
    image: apache/airflow:2.10.2-python3.11
    command: >
      bash -c "pip install --no-cache-dir -r /app/requirements.txt &&
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname CIAN --lastname Admin --role Admin --email admin@example.com || true &&
      airflow scheduler &
      airflow webserver --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_HOME: /app/data/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: 0.0.0.0
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - .:/app
    depends_on:
      - mlflow
      - kafka

  load-test:
    build: .
    profiles:
      - loadtest
    command: >
      python load_tests/cian_load_test.py
      --serving-url http://api:8000
      --requests 100
      --concurrency 10
      --output reports/load_test_results.json
      --markdown-report reports/load_test_report.md
    volumes:
      - .:/app
    depends_on:
      - api

  locust-load-test:
    build: .
    profiles:
      - loadtest
    command: >
      python load_tests/run_locust_scenarios.py
      --host http://api:8000
      --output-dir reports/locust
    volumes:
      - .:/app
    depends_on:
      - api
